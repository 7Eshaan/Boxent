[package]
name = "boxent-cli"
description = "The boxent command: daemon, MCP relay, VM management and environment checks."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "boxent"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
boxent-core = { path = "../boxent-core" }
boxent-driver-oci = { path = "../boxent-driver-oci" }
boxent-mcp = { path = "../boxent-mcp" }
tokio.workspace = true
mimalloc = { version = "0.1", default-features = false }
toml = "1"
tracing-subscriber.workspace = true
boxent-proto = { path = "../boxent-proto" }
libc.workspace = true

[lints]
workspace = true
